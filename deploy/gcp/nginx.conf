# WebSocket upgrade map: only send Connection: upgrade when the client
# actually asks for it, so normal requests keep Connection: "" (close).
# Required for socket.io's WebSocket transport through nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 443 ssl;
    server_name xactions.azeez-tech.com;

    # Certbot-managed TLS
    ssl_certificate /etc/letsencrypt/live/xactions.azeez-tech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xactions.azeez-tech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (mirrors dashboard/_headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Everything proxies to the Node API container. It serves the dashboard
    # statics AND the Socket.IO endpoint, so no separate static root or
    # /api special-casing is needed.
    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conditional upgrade headers for socket.io WebSocket transport
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSockets can stay open a long time
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Long-cache immutable assets (mirrors dashboard/_headers). The Node app
    # sets its own cache headers; this location adds a hard cap for static
    # assets only, never HTML.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://127.0.0.1:3001;
    }
}

# HTTP -> HTTPS redirect (Certbot)
server {
    listen 80;
    server_name xactions.azeez-tech.com;
    return 301 https://$host$request_uri;
}
