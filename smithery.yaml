# Smithery registry manifest for the XActions MCP server.
# Generated by scripts/sync-registry.mjs from package.json and server.json. Do not edit by hand.
# Version 3.5.0, 150 MCP tools.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      X_COOKIES:
        type: string
        description: "X/Twitter authentication cookies (JSON string or path to cookies file)"
      X_USERNAME:
        type: string
        description: "X/Twitter username for login"
      X_PASSWORD:
        type: string
        description: "X/Twitter password for login"
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["src/mcp/server.js"],
      env: Object.fromEntries(
        ["X_COOKIES", "X_USERNAME", "X_PASSWORD"]
          .filter((k) => config[k] !== undefined && config[k] !== "")
          .map((k) => [k, String(config[k])])
      )
    })
